<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>机・椅子 移動計画ツール</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body>
  <section id="pin-gate" class="pin-gate" aria-labelledby="pin-title">
    <form id="pin-form" class="pin-card">
      <div class="pin-brand">
        <div class="pin-icon" aria-hidden="true">🪑</div>
        <span class="pin-brand-copy">SCHOOL OPERATIONS</span>
      </div>
      <h1 id="pin-title">机・椅子 移動計画ツール</h1>
      <p>年度替わりの準備を、チームでスムーズに。<br>PINコードを入力して作業を始めます。</p>
      <label for="pin-input">PINコード</label>
      <input id="pin-input" type="password" inputmode="numeric" autocomplete="current-password" pattern="[0-9]*" maxlength="12" required autofocus>
      <p id="pin-error" class="pin-error" role="alert" hidden></p>
      <button type="submit" class="pin-submit">入室する</button>
    </form>
  </section>

  <div id="app-shell" hidden>
    <div id="toast"></div>

  <div id="header">
    <div id="header-left">
      <h1>🪑 机・椅子 移動計画ツール</h1>
      <p><span class="sync-dot" id="syncDot"></span><span id="syncLabel">オフライン</span></p>
    </div>
    <div id="header-btns">
      <input type="file" id="fileInput" accept=".json" hidden>
      <button class="hbtn" id="import-button">📂 読込</button>
      <button class="hbtn" id="reset-button">🗑</button>
    </div>
  </div>

  <nav id="tabs" aria-label="作業手順">
    <button class="tab active" data-tab="1" style="--active-color:#c0392b"><span class="tab-num">1</span>教室・人数</button>
    <button class="tab" data-tab="2" style="--active-color:#c0392b"><span class="tab-num">2</span>在庫入力</button>
    <button class="tab" data-tab="3" style="--active-color:#c0392b"><span class="tab-num">3</span>配置表</button>
    <button class="tab" data-tab="4" style="--active-color:#8e44ad"><span class="tab-num">4</span>AI移動計画</button>
    <button class="tab" data-tab="5" style="--active-color:#27ae60"><span class="tab-num">5</span>掲示用紙</button>
    <button class="tab" data-tab="6" style="--active-color:#e67e22"><span class="tab-num">🗺</span>マップ</button>
    <button class="tab" data-tab="7" style="--active-color:#16a085"><span class="tab-num">📝</span>配置メモ</button>
  </nav>

  <main id="main">
    <div id="panel-1" class="panel active"></div>
    <div id="panel-2" class="panel"></div>
    <div id="panel-3" class="panel"></div>
    <div id="panel-4" class="panel"></div>
    <div id="panel-5" class="panel"></div>
    <div id="panel-6" class="panel"></div>
    <div id="panel-7" class="panel"></div>
  </main>
  </div>

  <script src="data.js"></script>
  <script src="firebase.js"></script>
  <script src="app.js"></script>
</body>
</html>
